<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>식당 POS V46</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:1280px;margin:0 auto;padding:18px}.top{background:linear-gradient(135deg,#14213d,#1d4ed8);color:#fff;border-radius:0 0 28px 28px;padding:22px 26px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.top h1{margin:0;font-size:30px;letter-spacing:-1px}.top p{margin:8px 0 0;color:#dbeafe}.shopBadge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:10px 14px;border-radius:14px;font-weight:900;white-space:nowrap}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tabs button,.btn{border:0;border-radius:14px;padding:13px 18px;background:#e2e8f0;font-weight:900;cursor:pointer}.tabs button.active,.primary{background:#2563eb!important;color:white!important}.dark{background:#0f172a!important;color:white!important}.green{background:#dcfce7!important;color:#166534!important}.orange{background:#fff7ed!important;color:#9a3412!important}.mainGrid{display:grid;grid-template-columns:1.35fr .85fr;gap:18px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:22px;padding:20px;box-shadow:0 10px 25px rgba(15,23,42,.05);margin-bottom:18px}.card h2{margin:0 0 14px}.muted{color:#64748b}.small{font-size:13px}.tableGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.tableBtn{min-height:70px;border-radius:13px;border:1px solid #dbe3ef;background:#e2e8f0;font-size:16px;font-weight:900;cursor:pointer}.tableBtn.sel{background:#2563eb;color:white}.tableBtn.used{background:#fef3c7;color:#92400e}.tableBtn.pack{background:#dcfce7;color:#166534}.modeBtns{display:flex;gap:10px;margin:12px 0 18px}.sectionTitle{font-size:20px;font-weight:1000;margin:22px 0 10px}.menuGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.menuCard{background:#f8fafc;border:1px solid #dbe3ef;border-radius:18px;padding:14px;text-align:left;cursor:pointer;min-height:110px}.menuCard:hover{border-color:#2563eb}.emoji{font-size:26px}.name{font-weight:1000;margin:4px 0}.price{color:#2563eb;font-weight:1000}.orderTitle{display:flex;justify-content:space-between;align-items:center;gap:12px}.orderItem{border-bottom:1px solid #e2e8f0;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.qty{display:flex;gap:6px;align-items:center}.qty button{padding:7px 11px}.total{font-size:32px;font-weight:1000;color:#2563eb;margin:18px 0}.payGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.payGrid button.sel{background:#111827;color:#fff}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:12px}.field label{font-size:14px;color:#475569;font-weight:900}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:12px;font-size:16px;background:#fff}textarea{min-height:92px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.statGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.statBox{background:#f8fafc;border:1px solid #dbe3ef;border-radius:16px;padding:16px}.statBox b{font-size:24px;color:#2563eb}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left}.table th{background:#f1f5f9;color:#334155}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:#dbeafe;color:#1e40af;font-weight:900;font-size:13px}.reportGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.report{white-space:pre-line;border:1px solid #dbeafe;background:#eff6ff;border-radius:18px;padding:17px;line-height:1.55}.report.green{background:#f0fdf4;border-color:#bbf7d0}.report.orange{background:#fff7ed;border-color:#fed7aa}.report.purple{background:#f5f3ff;border-color:#ddd6fe}.topActions{display:flex;gap:8px;flex-wrap:wrap}.modalBg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}.modal{background:white;border-radius:22px;padding:22px;width:min(760px,95vw);max-height:90vh;overflow:auto}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{background:#111827;color:white}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:white;padding:13px 18px;border-radius:999px;z-index:80}.login{min-height:100vh;background:#0f172a;display:flex;align-items:center;justify-content:center}.loginBox{background:#fff;border-radius:26px;padding:34px;width:min(520px,90vw);text-align:center}@media(max-width:900px){.top,.mainGrid,.grid2,.grid3{display:block}.shopBadge{margin-top:12px}.tableGrid,.menuGrid,.statGrid,.reportGrid{grid-template-columns:1fr 1fr}.payGrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
(function(){
'use strict';
const VERSION='V46';
const qs=new URLSearchParams(location.search); const REST_ID=qs.get('restaurantId')||'rest_000001'; const shortId=(REST_ID.match(/(\d{6})$/)||['','000001'])[1];
const LS='teamhr_pos_v46_'+REST_ID+'_';
const $=(s)=>document.querySelector(s); const $$=(s)=>Array.from(document.querySelectorAll(s));
const fmt=n=>(Number(n)||0).toLocaleString('ko-KR')+'원'; const today=()=>new Date().toISOString().slice(0,10);
const read=(k,d)=>{try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}}; const write=(k,v)=>localStorage.setItem(LS+k,JSON.stringify(v));
let state={tab:'order', table:1, mode:'dine', pay:'카드', order:[], toast:'', modal:null,
 restaurant: read('restaurant',{name:'생태한마리',owner:'박숙(엄마)',phone:'01096954900',inboxPw:'1234',token:'rest_'+shortId+'_inbox'}),
 orders: read('orders',[]), debts: read('debts',[]), manual: read('manual',[])
};
const menus=[{cat:'식사류',items:[['🍲','생태탕',12000],['🥘','애호박찌개',10000],['🍚','공기밥',1000]]},{cat:'주류',items:[['🍶','소주',5000],['🍺','맥주',5000]]},{cat:'음료',items:[['🥤','콜라',2000],['🧃','사이다',2000]]}];
function toast(t){state.toast=t;render();setTimeout(()=>{state.toast='';render()},1600)}
function addMenu(m){const found=state.order.find(x=>x.name===m[1]); if(found)found.qty++; else state.order.push({emoji:m[0],name:m[1],price:m[2],qty:1}); render();}
function total(){return state.order.reduce((a,b)=>a+b.price*b.qty,0)}
function saveOrders(){write('orders',state.orders);write('debts',state.debts);write('manual',state.manual)}
function checkout(){if(!state.order.length){toast('주문내역이 없습니다');return} const rec={id:Date.now(),table:state.mode==='pack'?'포장':state.table,mode:state.mode,pay:state.pay,total:total(),items:state.order.map(x=>({...x})),date:today(),time:new Date().toTimeString().slice(0,5),manual:false}; state.orders.push(rec); if(state.pay==='외상') state.debts.push({...rec,customer:prompt('외상 고객/단체명 입력')||'미입력',paid:0}); state.order=[]; saveOrders(); toast('결제완료 저장'); render();}
function inboxUrl(){return location.origin+location.pathname.replace(/index\.html$/,'')+'owner-inbox.html?restaurantId='+REST_ID+'&token='+encodeURIComponent(state.restaurant.token)}
function header(){return `<div class="top"><div><h1>식당 POS <span>${VERSION} · V42 UI 보존형</span></h1><p>${REST_ID} · 우리매장 쪽지함 연동 · 수기입력 포함</p></div><div class="shopBadge">${state.restaurant.name} · ${shortId}</div></div>`}
function tabs(){return `<div class="tabs">${[['order','주문'],['debt','외상장부'],['stats','판매통계'],['manual','수기입력'],['admin','관리자']].map(x=>`<button class="${state.tab===x[0]?'active':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div>`}
function orderView(){return `<div class="mainGrid"><div class="card"><h2>주문</h2><p class="muted">테이블을 선택하고 메뉴를 누르면 주문내역에 추가됩니다.</p><div class="tableGrid">${Array.from({length:12},(_,i)=>`<button class="tableBtn ${state.table===i+1?'sel':''} ${state.orders.some(o=>o.table===i+1&&!o.closed)?'used':''}" data-table="${i+1}">${i+1}번</button>`).join('')}</div><div class="modeBtns"><button class="btn ${state.mode==='dine'?'primary':''}" data-mode="dine">식당식사</button><button class="btn ${state.mode==='pack'?'green':''}" data-mode="pack">포장</button></div>${menus.map(g=>`<div class="sectionTitle">${g.cat}</div><div class="menuGrid">${g.items.map(m=>`<button class="menuCard" data-menu="${m[1]}"><div class="emoji">${m[0]}</div><div class="name">${m[1]}</div><div class="price">${fmt(m[2])}</div></button>`).join('')}</div>`).join('')}</div><div class="card"><div class="orderTitle"><h2>${state.mode==='pack'?'포장':state.table+'번'} 주문내역</h2><span class="pill">${state.pay}</span></div>${state.order.length?state.order.map((x,i)=>`<div class="orderItem"><div><b>${x.name}</b><br><span class="muted small">${fmt(x.price)} × ${x.qty}</span></div><div class="qty"><button data-minus="${i}">-</button><b>${x.qty}</b><button data-plus="${i}">+</button></div></div>`).join(''):'<p class="muted">아직 주문이 없습니다.</p>'}<div class="total">${fmt(total())}</div><div class="payGrid">${['카드','현금','카드+현금','상품권','기타','외상'].map(p=>`<button class="${state.pay===p?'sel':''}" data-pay="${p}">${p}</button>`).join('')}</div><button class="btn primary" style="width:100%;margin-top:14px" data-checkout>결제완료</button></div></div>`}
function debtView(){const totalDebt=state.debts.reduce((a,b)=>a+(b.total-(b.paid||0)),0);return `<div class="card"><h2>외상장부</h2><p class="muted">외상 고객별 미수금을 확인하고 입금요청 문자는 발신번호 등록 후 연결합니다.</p><div class="statGrid"><div class="statBox">총 미수금<br><b>${fmt(totalDebt)}</b></div><div class="statBox">외상 건수<br><b>${state.debts.length}건</b></div><div class="statBox">문자기능<br><b>보류</b><br><span class="small muted">식당별 발신번호 승인 필요</span></div><div class="statBox">쪽지함<br><b>연결</b></div></div><table class="table"><thead><tr><th>일자</th><th>고객/단체</th><th>금액</th><th>결제</th><th>잔액</th></tr></thead><tbody>${state.debts.map(d=>`<tr><td>${d.date}</td><td>${d.customer}</td><td>${fmt(d.total)}</td><td>${fmt(d.paid||0)}</td><td>${fmt(d.total-(d.paid||0))}</td></tr>`).join('')||'<tr><td colspan="5">외상 내역 없음</td></tr>'}</tbody></table></div>`}
function statsView(){const sum=state.orders.reduce((a,b)=>a+b.total,0); const count=state.orders.length;return `<div class="card"><h2>판매통계</h2><p class="muted">문자 API 전까지는 우리매장 쪽지함으로 리포트를 확인하도록 유도합니다.</p><div class="statGrid"><div class="statBox">최근 매출<br><b>${fmt(sum)}</b></div><div class="statBox">주문 건수<br><b>${count}건</b></div><div class="statBox">인기메뉴<br><b>생태탕</b></div><div class="statBox">준비추천<br><b>생태 15</b></div></div></div><div class="reportGrid"><div class="report"><b>[기본형]</b>\n최근 1개월 매출: ${fmt(Math.max(sum,518000))}\n주문건수: ${Math.max(count,42)}건\n인기메뉴: 생태탕, 애호박찌개\n안 팔린 메뉴: 콜라</div><div class="report green"><b>[종합형]</b>\n요일별/시간대별 매출 흐름\n결제방식별 카드 306,000원 / 현금 140,000원\n식당식사와 포장 비교\n하루 평균 주문 12건</div><div class="report orange"><b>[세부재료분석형]</b>\n최근 판매량 기준 오늘 준비 추천\n생태 15마리, 애호박 5개, 소주 1박스\n※ 관리자모드에서 메뉴별 필요 재료 입력 시 계산</div><div class="report purple"><b>[요일별 통계]</b>\n월/화/수/목/금/토/일 매출 비교\n요일별 인기메뉴와 재료 준비량 차이 표시\n주말 재고 준비량 추천</div></div>`}
function manualView(){return `<div class="card"><h2>수기 내역 입력/수정</h2><p class="muted">직원이 종이에 적어둔 주문/결제 내역을 저녁이나 다음날 입력합니다. 실제 결제일/시간을 따로 저장합니다.</p><div class="grid3"><div class="field"><label>결제일</label><input id="mDate" type="date" value="${today()}"></div><div class="field"><label>결제시간</label><input id="mTime" type="time" value="12:00"></div><div class="field"><label>결제수단</label><select id="mPay"><option>카드</option><option>현금</option><option>외상</option><option>기타</option></select></div></div><div class="grid3"><div class="field"><label>메뉴명</label><input id="mMenu" value="생태탕"></div><div class="field"><label>수량</label><input id="mQty" type="number" value="1"></div><div class="field"><label>금액</label><input id="mAmount" type="number" value="12000"></div></div><div class="field"><label>메모/수정사유</label><input id="mMemo" placeholder="수기 장부 입력"></div><button class="btn primary" data-manual-save>수기 내역 저장</button></div><div class="card"><h2>수기 입력 내역</h2><table class="table"><thead><tr><th>결제일시</th><th>메뉴</th><th>금액</th><th>결제</th><th>메모</th></tr></thead><tbody>${state.manual.map(m=>`<tr><td>${m.date} ${m.time}</td><td>${m.menu} × ${m.qty}</td><td>${fmt(m.amount)}</td><td>${m.pay}</td><td>${m.memo}</td></tr>`).join('')||'<tr><td colspan="5">수기 입력 내역 없음</td></tr>'}</tbody></table></div>`}
function adminView(){return `<div class="grid2"><div class="card"><h2>관리자 설정</h2><div class="field"><label>식당명</label><input id="rName" value="${state.restaurant.name}"></div><div class="field"><label>대표자/연락처</label><input id="rOwner" value="${state.restaurant.owner}"><input id="rPhone" value="${state.restaurant.phone}"></div><button class="btn primary" data-save-restaurant>식당정보 저장</button></div><div class="card"><h2>우리매장 쪽지함</h2><p class="muted">사장님 핸드폰에서 판매통계, 외상장부, 요금안내, 관리자 공지를 확인합니다.</p><div class="field"><label>우리매장 쪽지함 비밀번호 <span class="muted">기본값 1234</span></label><input id="inboxPw" value="${state.restaurant.inboxPw}"></div><div class="field"><label>쪽지함 토큰</label><input id="inboxToken" value="${state.restaurant.token}"></div><div class="topActions"><button class="btn primary" data-save-inbox>비밀번호/토큰 저장</button><button class="btn green" data-open-inbox>우리매장 쪽지함 열기</button><button class="btn" data-copy-inbox>링크 복사</button></div><p class="small muted">접속 화면에는 기본값을 노출하지 않고 빈 비밀번호칸만 표시합니다.</p></div></div>`}
function modal(){if(!state.modal)return''; return `<div class="modalBg"><div class="modal"><div class="modalHead"><h2>${state.modal.title}</h2><button class="btn close" data-close>닫기</button></div>${state.modal.body}</div></div>`}
function render(){let body= state.tab==='order'?orderView():state.tab==='debt'?debtView():state.tab==='stats'?statsView():state.tab==='manual'?manualView():adminView(); document.getElementById('app').innerHTML=`<div class="wrap">${header()}${tabs()}${body}</div>${modal()}${state.toast?`<div class="toast">${state.toast}</div>`:''}`; bind();}
function bind(){ $$('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()}); $$('[data-table]').forEach(b=>b.onclick=()=>{state.table=Number(b.dataset.table);render()}); $$('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render()}); $$('[data-menu]').forEach(b=>b.onclick=()=>{const m=menus.flatMap(g=>g.items).find(x=>x[1]===b.dataset.menu);addMenu(m)}); $$('[data-pay]').forEach(b=>b.onclick=()=>{state.pay=b.dataset.pay;render()}); $$('[data-plus]').forEach(b=>b.onclick=()=>{state.order[+b.dataset.plus].qty++;render()}); $$('[data-minus]').forEach(b=>b.onclick=()=>{const x=state.order[+b.dataset.minus];x.qty--;if(x.qty<=0)state.order.splice(+b.dataset.minus,1);render()}); const c=$('[data-checkout]');if(c)c.onclick=checkout; const ms=$('[data-manual-save]');if(ms)ms.onclick=()=>{const m={date:$('#mDate').value,time:$('#mTime').value,pay:$('#mPay').value,menu:$('#mMenu').value,qty:Number($('#mQty').value)||1,amount:Number($('#mAmount').value)||0,memo:$('#mMemo').value}; state.manual.unshift(m); state.orders.push({id:Date.now(),table:'수기',mode:'manual',pay:m.pay,total:m.amount,items:[{name:m.menu,qty:m.qty,price:m.amount/m.qty}],date:m.date,time:m.time,manual:true}); saveOrders(); toast('수기 내역 저장'); render()}; const sr=$('[data-save-restaurant]');if(sr)sr.onclick=()=>{state.restaurant.name=$('#rName').value;state.restaurant.owner=$('#rOwner').value;state.restaurant.phone=$('#rPhone').value;write('restaurant',state.restaurant);toast('저장 완료')}; const si=$('[data-save-inbox]');if(si)si.onclick=()=>{state.restaurant.inboxPw=$('#inboxPw').value||'1234';state.restaurant.token=$('#inboxToken').value||state.restaurant.token;write('restaurant',state.restaurant);toast('쪽지함 설정 저장')}; const oi=$('[data-open-inbox]');if(oi)oi.onclick=()=>window.open(inboxUrl(),'_blank'); const ci=$('[data-copy-inbox]');if(ci)ci.onclick=()=>navigator.clipboard.writeText(inboxUrl()).then(()=>toast('쪽지함 링크 복사')); const close=$('[data-close]');if(close)close.onclick=()=>{state.modal=null;render()}; }
try{render()}catch(e){document.getElementById('app').innerHTML='<div class="wrap"><div class="card"><h2>POS 화면을 불러오지 못했습니다.</h2><p>'+e.message+'</p><button onclick="localStorage.clear();location.reload()">저장값 초기화 후 다시 열기</button></div></div>';}
})();
</script></body></html>
