      .v69-dutch-modal{position:fixed;inset:0;z-index:99999;background:rgba(15,23,42,.58);display:flex;align-items:center;justify-content:center;padding:18px}.v69-dutch-box{position:relative;background:white;border-radius:22px;width:min(730px,96vw);max-height:90vh;display:flex;flex-direction:column;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.28)}.v69-dutch-box h2{font-size:28px;margin:0 0 12px}.v69-x{position:absolute;right:20px;top:18px;width:54px;height:54px;border:0;border-radius:14px;background:#111827;color:white;font-size:28px;font-weight:900}.v69-dutch-top{flex:0 0 auto}.v69-dutch-top b{font-size:24px;display:block;margin:8px 0}.v69-dutch-top input{height:48px;border:2px solid #cbd5e1;border-radius:12px;font-size:22px;font-weight:900;padding:0 12px;width:150px}.v69-dutch-list{flex:1 1 240px;min-height:120px;max-height:260px;overflow:auto;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;margin:10px 0;padding:10px 0}.v69-dutch-list label{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:8px 0;font-weight:900}.v69-dutch-list input{height:46px;border:2px solid #cbd5e1;border-radius:12px;font-size:20px;padding:0 12px}.v69-remain{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;background:#dbeafe;border:2px solid #93c5fd;border-radius:16px;padding:13px 16px;color:#1e3a8a;font-weight:900}.v69-remain strong{font-size:30px}.v69-rec{flex:0 1 140px;max-height:140px;overflow:auto;border:1px dashed #cbd5e1;border-radius:12px;padding:8px 12px;margin:10px 0}.v69-rec p{margin:7px 0;font-weight:800}.v69-close{height:48px;border:0;border-radius:12px;background:#e5e7eb;font-size:18px;font-weight:900;padding:0 22px;align-self:flex-start}

  function cleanupOld(){

  }
  function renderHeader(){
    const order=getOrderPanel(); const h=order?.querySelector('h2'); if(!order||!h) return;
    const n=activeTable(); const g=groupFor(n); const mode=selecting?'selecting':(g?'split':'merge'); const key=`${n}:${mode}:${selected.join('.')}`;
    if(h.dataset.v69Key===key && h.querySelector('.v69-order-head')) return;
    patching=true;
    h.dataset.v69Key=key; h.innerHTML=''; h.classList.add('v69-order-head');
    const title=document.createElement('span'); title.className='v69-order-title'; title.textContent=`주문내역 (${n}번)`; h.appendChild(title);
    const tools=document.createElement('span'); tools.className='v69-order-tools';
    const main=document.createElement('button'); main.type='button'; main.className=g&&!selecting?'split':'merge'; if(selecting) main.classList.add('active'); main.textContent=selecting?`선택완료 ${selected.length?selected.join('·'):''}`:(g?'테이블 나누기':'테이블 합치기');
    const dutch=document.createElement('button'); dutch.type='button'; dutch.className='dutch'; dutch.textContent='더치페이';
    tools.append(main,dutch); h.appendChild(tools);

  function renderSummary(){
    const order=getOrderPanel(); const h=order?.querySelector('h2'); if(!order||!h) return;
    const g=groupFor(activeTable()); const old=order.querySelector(':scope > .v69-merge-summary');
    if(!g){ if(old) old.remove(); return; }
    const total=groupTotal(g); const open=old?.dataset.open==='1'; const sig=`${sortNums(g.tables).join(',')}:${total}:${open}`;
    if(old && old.dataset.sig===sig) return;
    patching=true;
    const box=old||document.createElement('div'); box.className='v69-merge-summary'; box.dataset.open=open?'1':'0'; box.dataset.sig=sig;
    box.innerHTML=`<div class="line"><span>통합결제: ${sortNums(g.tables).join('·')}</span><strong>${money(total)}</strong></div>`;
    if(open){ const det=document.createElement('div'); det.className='v69-merge-detail'; sortNums(g.tables).forEach(t=>{const tt=tableTotal(t); const row=document.createElement('div'); row.innerHTML=`<span>${t}번 ${tt?'':'주문 없음'}</span><b>${money(tt)}</b>`; det.appendChild(row);}); box.appendChild(det); }
    box.onclick=()=>{box.dataset.open=box.dataset.open==='1'?'0':'1'; box.dataset.sig=''; schedule();};
    if(!old) h.insertAdjacentElement('afterend',box);
    patching=false;
  }
  function wrapOrderList(){
    const order=getOrderPanel(); if(!order) return;
    const payGrid=order.querySelector(':scope > .payGrid'); if(!payGrid) return;
    let wrap=order.querySelector(':scope > .v69-order-list');
    if(!wrap){ wrap=document.createElement('div'); wrap.className='v69-order-list'; payGrid.parentElement.insertBefore(wrap,payGrid); }
    const keep=new Set([order.querySelector(':scope > h2'), order.querySelector(':scope > .v69-merge-summary'), wrap, payGrid, order.querySelector(':scope > .total'), order.querySelector(':scope > button.pay'), order.querySelector(':scope > button.ghost')].filter(Boolean));
    Array.from(order.children).forEach(ch=>{ if(!keep.has(ch) && ch!==wrap){ wrap.appendChild(ch); } });
  }
  function markTables(){
    const active=activeTable(); const gActive=groupFor(active);
    tableButtons().forEach(btn=>{const n=tableOfButton(btn); if(!n) return; const g=groupFor(n); btn.classList.remove('v69-merged','v69-active-merged','v69-pick'); btn.removeAttribute('data-v69-group'); if(g){btn.classList.add('v69-merged'); btn.setAttribute('data-v69-group',`${sortNums(g.tables).join('·')} 통합`)} if(g&&gActive&&sameGroup(g,gActive)) btn.classList.add('v69-active-merged'); if(selecting&&selected.includes(n)) btn.classList.add('v69-pick');});
  }
  function patchAdmin(){
    const box=$all('.modalBox.admin,.modalBox.wide,.modalBox').find(b=>/관리자모드/.test(b.querySelector('h2,h3')?.textContent||'')); if(!box) return;
    const title=$all('h2,h3',box).find(h=>(h.textContent||'').trim()==='관리자모드'); if(!title||box.querySelector('.v69-admin-title-row')) return;
    patching=true;
    const row=document.createElement('div'); row.className='v69-admin-title-row'; title.parentElement.insertBefore(row,title); row.appendChild(title);
    const share=document.createElement('div'); share.className='v69-admin-share'; share.innerHTML='<button type="button">POS기 주소복사</button><button type="button">POS QR보기</button>'; row.appendChild(share);
    share.children[0].onclick=()=>{navigator.clipboard?.writeText(location.href); toast('POS 주소를 복사했습니다.');};
    share.children[1].onclick=()=>toast('현재 POS 주소 기준 QR 보기입니다. QR 팝업 연동은 종합관리 주소와 함께 보강됩니다.');
    patching=false;

  function startMerge(){selecting=true; selected=sortNums([activeTable()]); document.body.classList.add('v69-selecting'); schedule(); toast('테이블 선택중입니다. 합칠 테이블을 누른 뒤 선택완료를 누르세요.');}
  function finishMerge(){if(selected.length<2){toast('합칠 테이블을 2개 이상 선택해주세요.');return;} const tables=sortNums(selected); const rest=groups().filter(g=>!sortNums(g.tables).some(t=>tables.includes(t))); rest.push({id:'grp_'+Date.now(),tables,createdAt:Date.now(),mode:'payment-only'}); setGroups(rest); selecting=false; selected=[]; document.body.classList.remove('v69-selecting'); schedule(); toast(`${tables.join('·')}번 통합결제를 만들었습니다.`);}
  function splitCurrent(){const g=groupFor(activeTable()); if(!g){toast('통합된 테이블이 아닙니다.');return;} setGroups(groups().filter(x=>x.id!==g.id)); schedule(); toast(`${sortNums(g.tables).join('·')} 통합을 해제했습니다.`);}
  function openDutch(){
    const total=visibleCurrentTotal(); $all('.v69-dutch-modal').forEach(x=>x.remove());
    const modal=document.createElement('div'); modal.className='v69-dutch-modal'; modal.innerHTML=`<div class="v69-dutch-box"><button class="v69-x">×</button><h2>더치페이 계산기</h2><div class="v69-dutch-top"><p>현재 주문 총액</p><b>${money(total)}</b><label>결제인원 <input id="v69People" type="number" inputmode="numeric" min="1" value="2"> 명</label></div><div id="v69Inputs" class="v69-dutch-list"></div><div class="v69-remain"><span>남은금액</span><strong>${money(total)}</strong></div><div class="v69-rec"></div><button class="v69-close">닫기</button></div>`;
    document.body.appendChild(modal); const people=modal.querySelector('#v69People'), list=modal.querySelector('#v69Inputs'), remainEl=modal.querySelector('.v69-remain strong'), rec=modal.querySelector('.v69-rec');
    function render(){const count=Math.max(1,Number(people.value)||1); const old=$all('input',list).map(i=>i.value); list.innerHTML=''; for(let i=0;i<count;i++){list.insertAdjacentHTML('beforeend',`<label><span>${i+1}번 결제</span><input type="number" inputmode="numeric" placeholder="금액 입력" value="${old[i]||''}"></label>`)} $all('input',list).forEach(i=>i.addEventListener('input',calc)); calc();}
    function calc(){const vals=$all('input',list).map(i=>num(i.value)); const paid=vals.reduce((a,b)=>a+b,0); const remain=Math.max(0,total-paid); const empty=vals.filter(v=>!v).length; remainEl.textContent=money(remain); let html=`<p>남은 인원: <b>${empty}명</b></p>`; if(empty){const base=Math.floor(remain/empty), extra=remain-base*empty; let seen=0; vals.forEach((v,i)=>{if(!v){seen++; html+=`<p>${i+1}번 추천: <b>${money(base+(seen===empty?extra:0))}</b></p>`}})} rec.innerHTML=html;}
    people.addEventListener('input',render); modal.querySelector('.v69-x').onclick=()=>modal.remove(); modal.querySelector('.v69-close').onclick=()=>modal.remove(); modal.onclick=e=>{if(e.target===modal)modal.remove()}; render();
  }
  function handleClick(e){
    const btn=e.target.closest('button'); if(!btn) return;
    const tbtn=btn.closest('.tableBtn');
    if(tbtn){const n=tableOfButton(tbtn); if(!n) return; if(selecting){e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); selected=selected.includes(n)?selected.filter(x=>x!==n):sortNums([...selected,n]); schedule(); return;} lastActive=n; setTimeout(schedule,80); return;}
    if(btn.closest('.v69-order-tools')){e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); if(btn.classList.contains('dutch')) openDutch(); else if(selecting) finishMerge(); else if(btn.classList.contains('split')) splitCurrent(); else startMerge();}
  }
  function applyScaleMode(){
    try{const mode=localStorage.getItem(key('displayMode'))||localStorage.getItem('displayMode')||''; document.body.classList.toggle('fixed-scale-mode',/원본|fixed|scale/i.test(mode));}catch(e){}
  }
  function patchText(){document.title='식당 POS V69'; $all('span,b,h1,h2,h3,p').forEach(el=>{if(/V6[0-8]/.test(el.textContent||'')) el.childNodes.forEach(n=>{if(n.nodeType===3)n.nodeValue=n.nodeValue.replace(/V6[0-8]/g,VERSION)})})}
  function tick(){ if(patching) return; patching=true; try{injectStyle(); cleanupOld(); patchText(); renderHeader(); renderSummary(); wrapOrderList(); markTables(); patchAdmin(); applyScaleMode();}catch(e){console.error('[POS V69 patch]',e)} finally{patching=false;} }
  function schedule(){ if(raf) return; raf=requestAnimationFrame(()=>{raf=0;tick();}); }
  function ready(fn){document.readyState==='loading'?document.addEventListener('DOMContentLoaded',fn):fn()}
  ready(()=>{injectStyle(); document.addEventListener('click',handleClick,true); new MutationObserver(()=>{ if(!patching) schedule(); }).observe(document.body,{childList:true,subtree:true}); setTimeout(schedule,300); setTimeout(schedule,1000);});
})();
