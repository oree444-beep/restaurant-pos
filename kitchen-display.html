<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주방 주문현황판 V57</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a} .top{background:#0f2b65;color:white;padding:22px 24px} .top h1{margin:0;font-size:28px}.top p{margin:8px 0 0;color:#dbeafe}.wrap{max-width:1100px;margin:20px auto;padding:0 16px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;background:#2563eb;color:white}.btn.gray{background:#e2e8f0;color:#0f172a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}.card{background:white;border:1px solid #dbe4f0;border-radius:18px;padding:18px;box-shadow:0 8px 20px rgba(15,23,42,.06)}.card h2{margin:0 0 6px;font-size:22px}.meta{color:#64748b;font-size:14px;margin-bottom:10px}.items{font-size:20px;font-weight:900;line-height:1.6}.badge{display:inline-block;background:#dcfce7;color:#166534;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:900}.empty{background:white;border:2px dashed #cbd5e1;border-radius:18px;padding:40px;text-align:center;color:#64748b;font-weight:800}.done{opacity:.55}.footer{margin-top:20px;color:#64748b;font-size:13px;line-height:1.6}
  </style>
</head>
<body>
  <div class="top"><h1 id="title">주방 주문현황판 V57</h1><p>POS에서 보낸 테스트 주문과 주방 주문을 확인합니다.</p></div>
  <div class="wrap">
    <div class="toolbar"><div><b id="rid"></b><br><span id="updated" class="meta"></span></div><div><button class="btn gray" onclick="clearDone()">완료 전체 삭제</button><button class="btn" onclick="render()">새로고침</button></div></div>
    <div id="list" class="grid"></div>
    <div class="footer">※ V57 임시 테스트 화면입니다. 같은 기기/브라우저에서는 POS의 테스트 전송 내역이 바로 표시됩니다. 실제 주방 태블릿과 POS 간 실시간 동기화는 이후 Firebase 연동으로 보강합니다.</div>
  </div>
<script>
const params=new URLSearchParams(location.search);
const restaurantId=params.get('restaurantId')||'rest_000001';
const name=params.get('name')||'우리매장';
const key='pos_v57_kitchen_orders_'+restaurantId;
document.getElementById('title').textContent=name+' 주방 주문현황판 V57';
document.getElementById('rid').textContent='식당ID: '+restaurantId;
function read(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}}
function save(list){localStorage.setItem(key,JSON.stringify(list))}
function fmt(s){try{return new Date(s).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function done(id){const list=read().map(o=>o.id===id?{...o,status:'완료'}:o);save(list);render()}
function clearDone(){save(read().filter(o=>o.status!=='완료'));render()}
function render(){const list=read();document.getElementById('updated').textContent='최근 확인: '+new Date().toLocaleTimeString('ko-KR');const root=document.getElementById('list');if(!list.length){root.innerHTML='<div class="empty">아직 표시할 주문이 없습니다.<br>POS 관리자모드에서 [주방 테스트 전송]을 눌러보세요.</div>';return}root.innerHTML=list.map(o=>`<div class="card ${o.status==='완료'?'done':''}"><span class="badge">${o.type||'주문'}</span><h2>${o.table||'테이블'} · ${o.status||'대기'}</h2><div class="meta">${fmt(o.createdAt)} · ${o.restaurantName||''}</div><div class="items">${(o.items||[]).map(i=>`${i.name} ${i.qty}개`).join('<br>')}</div>${o.memo?`<p class="meta">${o.memo}</p>`:''}<button class="btn gray" onclick="done('${o.id}')">완료 처리</button></div>`).join('')}
render();setInterval(render,2000);
</script>
</body></html>
