<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>우리매장 쪽지함 V50</title>
<style>
:root{--blue:#2563eb;--navy:#0f1d3a;--bg:#eef3f9;--line:#dbe4ef;--text:#111827;--muted:#64748b;}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:880px;margin:0 auto;padding:22px}.hero{background:linear-gradient(135deg,#172554,#2563eb);color:#fff;border-radius:0 0 26px 26px;padding:28px 28px;margin:-22px -22px 18px}.hero h1{margin:0;font-size:30px}.hero p{opacity:.9;margin:8px 0 0}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:0 10px 24px rgba(15,23,42,.06)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button,.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:#e8eef6;cursor:pointer}.tabs button.on,.btn.primary{background:var(--blue);color:#fff}.muted{color:var(--muted)}.report{border:1px solid var(--line);background:#f8fafc;border-radius:18px;padding:16px;margin:12px 0}.report b{display:block;margin-bottom:6px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.mini{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:14px}.login{max-width:520px;margin:80px auto}.login input,.form input,.form textarea,.form select{width:100%;border:1px solid #cbd5e1;border-radius:14px;padding:13px;font-size:16px;margin:6px 0 12px}.form textarea{min-height:120px}.notice{background:#fff7ed;border-color:#fed7aa}.ok{background:#ecfdf5;border-color:#bbf7d0}.right{text-align:right}@media(max-width:720px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}.wrap{padding:16px}.hero{margin:-16px -16px 14px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const params=new URLSearchParams(location.search);
const rid=params.get('restaurantId')||'rest_000001';
const id=(rid.match(/(\d{6})$/)||[])[1]||'000001';
const name=params.get('name')||'생태한마리';
const KEY=`ownerInboxAuth:${rid}`;
const app=document.getElementById('app');
let tab='all';
function authed(){return localStorage.getItem(KEY)==='yes'}
function login(){const v=document.getElementById('pw').value.trim(); if(!v){alert('비밀번호를 입력해주세요');return;} localStorage.setItem(KEY,'yes'); render();}
function logout(){localStorage.removeItem(KEY); render();}
function renderLogin(){app.innerHTML=`<div class="wrap"><div class="card login"><h1>${name} 우리매장 쪽지함 ${id}</h1><p class="muted">비밀번호를 입력하면 판매통계, 외상장부, 요금/공지와 관리자 답변을 확인할 수 있습니다.</p><input id="pw" type="password" placeholder="우리매장 쪽지함 비밀번호" onkeydown="if(event.key==='Enter')login()" autofocus><button class="btn primary" onclick="login()">접속하기</button><p class="muted">비밀번호는 매장 POS 관리자모드 또는 종합관리에서 확인/변경합니다.</p></div></div>`}
const messages=[
{cat:'sales',title:'[판매통계] 최근 30일 요약',body:'총매출 518,000원 · 주문 42건 · 인기메뉴 생태탕/애호박찌개 · 오늘 준비 추천: 생태 15마리, 애호박 5개'},
{cat:'credit',title:'[외상장부] 미수금 요약',body:'현재 미수금 72,000원 · 생태한마리 단체 3건 · 최근 일부결제 1건이 있습니다.'},
{cat:'fee',title:'[요금/공지] 우리매장 쪽지함 안내',body:'문자 비용 없이 사장님 핸드폰에서 판매통계, 외상장부, 요금안내, 관리자 공지를 확인할 수 있습니다.'}
];
function sendInquiry(){const type=document.getElementById('inqType').value; const title=document.getElementById('inqTitle').value.trim(); const body=document.getElementById('inqBody').value.trim(); if(!title||!body){alert('제목과 내용을 입력해주세요');return;} const saved=JSON.parse(localStorage.getItem(`ownerInquiry:${rid}`)||'[]'); saved.unshift({id:Date.now(),type,title,body,createdAt:new Date().toISOString(),status:'접수대기'}); localStorage.setItem(`ownerInquiry:${rid}`,JSON.stringify(saved)); alert('문의쪽지를 보냈습니다. 종합관리 연동 후 관리자 게시판에 접수됩니다.'); document.getElementById('inqTitle').value=''; document.getElementById('inqBody').value=''; render();}
function render(){ if(!authed()) return renderLogin(); const filtered=tab==='all'?messages:messages.filter(m=>m.cat===tab); const inquiries=JSON.parse(localStorage.getItem(`ownerInquiry:${rid}`)||'[]'); app.innerHTML=`<div class="wrap"><div class="hero"><h1>${name} 우리매장 쪽지함 ${id}</h1><p>판매통계 · 외상장부 · 요금안내 · 관리자 공지를 핸드폰에서 확인합니다.</p></div><div class="card"><h2>새 쪽지함</h2><p class="muted">최신 쪽지와 리포트를 확인하세요.</p><div class="tabs"><button class="${tab==='all'?'on':''}" onclick="tab='all';render()">전체</button><button class="${tab==='sales'?'on':''}" onclick="tab='sales';render()">판매통계</button><button class="${tab==='credit'?'on':''}" onclick="tab='credit';render()">외상장부</button><button class="${tab==='fee'?'on':''}" onclick="tab='fee';render()">요금/공지</button></div></div><div class="card"><h2>${tab==='all'?'전체':tab==='sales'?'판매통계':tab==='credit'?'외상장부':'요금/공지'} <small class="muted">${filtered.length}건</small></h2>${filtered.map(m=>`<div class="report"><b>${m.title}</b><p>${m.body}</p><small class="muted">2026. 6. 5. 오전 09:00</small></div>`).join('')}</div><div class="card ok"><h2>관리자에게 문의하기</h2><div class="form"><select id="inqType"><option>사용법 문의</option><option>오류 문의</option><option>요금/포인트 문의</option><option>기타</option></select><input id="inqTitle" placeholder="문의 제목"><textarea id="inqBody" placeholder="문의 내용을 입력해주세요"></textarea><button class="btn primary" onclick="sendInquiry()">문의쪽지 보내기</button></div>${inquiries.length?`<h3>보낸 문의</h3>${inquiries.slice(0,3).map(i=>`<div class="report"><b>${i.title}</b><p>${i.type} · ${i.status}</p><small>${new Date(i.createdAt).toLocaleString()}</small></div>`).join('')}`:''}</div><div class="card notice"><b>홈화면 바로가기 안내</b><p class="muted">핸드폰 브라우저 메뉴에서 “홈 화면에 추가”를 누르면 앱처럼 바로 열 수 있습니다. 웹 쪽지함은 카톡처럼 자동 푸시는 아니지만, 문자 비용 없이 확인할 수 있습니다.</p></div><div class="right"><button class="btn" onclick="logout()">이 기기 인증 해제</button></div></div>`}
render();
</script>
</body>
</html>
