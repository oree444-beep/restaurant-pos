<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>공통쪽지함 연결</title><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8fafc;color:#111827}.card{max-width:560px;margin:80px auto;padding:28px;border:1px solid #dbe4ef;border-radius:22px;background:white;text-align:center;box-shadow:0 18px 50px rgba(15,23,42,.08)}button{border:0;border-radius:14px;background:#2563eb;color:white;font-weight:900;padding:13px 18px}</style></head><body><div class="card"><h1>공통쪽지함으로 연결합니다</h1><p>POS 안의 임시 쪽지함 대신 공통쪽지함 고객용 화면을 사용합니다.</p><button id="open">우리매장 쪽지함 열기</button></div><script>const base='https://teamhr-common-inbox.vercel.app';const q=new URLSearchParams(location.search);const u=new URL(base);u.searchParams.set('inboxId',q.get('inboxId')||'pos_rest_000001');u.searchParams.set('token',q.get('token')||'demo_pos_token');document.getElementById('open').onclick=()=>location.href=u.toString();setTimeout(()=>location.replace(u.toString()),700);</script></body></html>
