<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>우리매장 쪽지함 V46</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#0f172a;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:900px;margin:0 auto;padding:22px}.top{background:linear-gradient(135deg,#14213d,#1d4ed8);color:white;border-radius:0 0 28px 28px;padding:24px}.top h1{font-size:30px;margin:0 0 8px}.card{background:white;border:1px solid #dbe3ef;border-radius:22px;padding:20px;margin:18px 0;box-shadow:0 10px 25px rgba(15,23,42,.05)}button{border:0;border-radius:14px;padding:12px 16px;background:#e2e8f0;font-weight:900;cursor:pointer}.active,.primary{background:#2563eb;color:white}.tabs{display:flex;gap:8px;flex-wrap:wrap}.msg{background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin:12px 0;white-space:pre-line}.muted{color:#64748b}input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:13px;font-size:16px}textarea{min-height:110px}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a}.loginBox{width:min(520px,90vw);background:white;border-radius:26px;padding:34px;text-align:center}.field{margin:12px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:white;border-radius:999px;padding:13px 18px}</style></head><body><div id="app"></div><script>(function(){const qs=new URLSearchParams(location.search);const REST_ID=qs.get('restaurantId')||'rest_000001';const shortId=(REST_ID.match(/(\d{6})$/)||['','000001'])[1];const LS='teamhr_pos_v46_'+REST_ID+'_';const read=(k,d)=>{try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):d}catch(e){return d}};const write=(k,v)=>localStorage.setItem(LS+k,JSON.stringify(v));let restaurant=read('restaurant',{name:'생태한마리',inboxPw:'1234'});let authed=sessionStorage.getItem(LS+'inboxAuth')==='ok';let tab='all';let toast='';const messages=[{type:'판매통계',title:'[판매통계] 최근 30일 요약',body:'최근 30일 매출 518,000원\n인기메뉴: 생태탕, 애호박찌개\n오늘 준비 추천: 생태 15마리, 애호박 5개'},{type:'외상장부',title:'[외상장부] 미수금 요약',body:'현재 미수금 72,000원\n일부결제 내역과 고객별 잔액을 확인하세요.'},{type:'요금/공지',title:'[요금/공지] 우리매장 쪽지함 안내',body:'문자 비용 없이 사장님 핸드폰에서 판매통계, 외상장부, 요금안내, 관리자 공지를 확인할 수 있습니다.'}];function showToast(t){toast=t;render();setTimeout(()=>{toast='';render()},1600)}function login(){let p=document.getElementById('pw').value;if(p===(restaurant.inboxPw||'1234')){sessionStorage.setItem(LS+'inboxAuth','ok');authed=true;render()}else showToast('비밀번호가 맞지 않습니다')}function render(){if(!authed){document.getElementById('app').innerHTML=`<div class="login"><div class="loginBox"><h1>우리매장 쪽지함</h1><p class="muted">${restaurant.name} ${shortId}</p><input id="pw" type="password" placeholder="쪽지함 비밀번호 입력"><br><br><button class="primary" id="loginBtn">접속하기</button></div></div>${toast?`<div class="toast">${toast}</div>`:''}`;document.getElementById('loginBtn').onclick=login;return}const filtered=tab==='all'?messages:messages.filter(m=>m.type===tab);document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><h1>${restaurant.name} 우리매장 쪽지함 ${shortId}</h1><p>판매통계 · 외상장부 · 요금안내 · 관리자 공지를 핸드폰에서 확인합니다.</p></div><div class="card"><h2>새 쪽지함</h2><div class="tabs">${['all','판매통계','외상장부','요금/공지'].map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t==='all'?'전체':t}</button>`).join('')}<button class="primary" id="ask">관리자에게 문의하기</button></div></div><div class="card"><h2>${tab==='all'?'전체':tab}</h2>${filtered.map(m=>`<div class="msg"><b>${m.title}</b>\n<span class="muted">2026. 6. 5.</span>\n\n${m.body}</div>`).join('')}</div><div class="card" id="form" style="display:none"><h2>관리자에게 문의쪽지 보내기</h2><div class="field"><select id="qType"><option>사용법 문의</option><option>요금/포인트 문의</option><option>오류 신고</option><option>기타</option></select></div><div class="field"><input id="qTitle" placeholder="제목"></div><div class="field"><textarea id="qBody" placeholder="문의 내용을 입력하세요"></textarea></div><button class="primary" id="send">문의 보내기</button></div></div>${toast?`<div class="toast">${toast}</div>`:''}`;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.getElementById('ask').onclick=()=>{document.getElementById('form').style.display='block';location.hash='form'};document.getElementById('send').onclick=()=>{showToast('문의쪽지가 접수되었습니다. 종합관리 문의게시판과 연동 예정입니다.')}}render()})();</script></body></html>
